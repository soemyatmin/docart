apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-lists-api
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: my-lists-api
  template:
    metadata:
      labels:
        app: my-lists-api
    spec:
      containers:
        - name: my-lists-api
          image: 732179706699.dkr.ecr.ap-northeast-1.amazonaws.com/eks-study-api:v2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          