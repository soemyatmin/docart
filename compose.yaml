services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: docart
      POSTGRES_PASSWORD: docart_local_dev
      POSTGRES_DB: docart
    volumes:
      - docart-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docart -d docart"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: ./backend
    ports:
      - "3001:3000"
    environment:
      DB_HOST: postgres
      DB_PASSWORD: docart_local_dev
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  docart-pgdata:
    external: true
    name: docart-pgdata